<!DOCTYPE html>
<html>
<head>
  <title>Student Registration Form</title>
</head>
<body>
  <h1 style="text-align: center;">Student Registration Form</h1>

  <div id="container">
    <p>
      Name: <input type="text" id="nameinput" placeholder="Enter your Name">
      <span id="nameError" style="color:red;"></span>
    </p>

    <p>
      Email: <input type="text" id="emailInput" placeholder="Enter your Email id">
      <span id="emailError" style="color:red;"></span>
    </p>

    <p>
      Password: <input type="text" id="passwordInput" placeholder="Enter your Password">
      <span id="passwordError" style="color:red;"></span>
    </p>

    <button id="submitbtn" disabled>Submit</button>
  </div>

  <script>
    const nameInput = document.getElementById("nameinput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");

    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    const submitBtn = document.getElementById("submitbtn");

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Function to validate all fields
    function validateForm() {
      let isValid = true;

      // Name validation
      if (nameInput.value.trim() === "") {
        nameError.textContent = "Name can't be empty";
        isValid = false;
      } else {
        nameError.textContent = "";
      }

      // Email validation
      if (!emailRegex.test(emailInput.value.trim())) {
        emailError.textContent = "Invalid email format";
        isValid = false;
      } else {
        emailError.textContent = "";
      }

      // Password validation
      if (passwordInput.value.length < 6) {
        passwordError.textContent = "Password must be at least 6 characters";
        isValid = false;
      } else {
        passwordError.textContent = "";
      }

      // Enable/disable submit button based on validity
      submitBtn.disabled = !isValid;
    }

    // Add real-time validation listeners
    nameInput.addEventListener("input", validateForm);
    emailInput.addEventListener("input", validateForm);
    passwordInput.addEventListener("input", validateForm);

    // Handle submit
    submitBtn.addEventListener("click", function () {
      alert("Registration successful!");
    });

    // Initial validation to disable button on page load
    validateForm();
  </script>
</body>
</html>
